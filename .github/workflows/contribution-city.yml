name: Generate Contribution City

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-city.yml"
      - "scripts/generate_contribution_city.py"

permissions:
  contents: write

jobs:
  generate:
    name: Build Contribution City
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate contribution city
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_contribution_city.py

      - name: Commit contribution city
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-city.svg

          if git diff --cached --quiet; then
            echo "No changes to contribution city."
          else
            git commit -m "Update contribution city"
            git push
          fi
