name: GitHub Profile 3D Contrib

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Allows you to run it manually
  workflow_dispatch:

  # Also regenerate when the workflow/config changes
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    name: Generate GitHub Profile 3D Contrib

    steps:
      # Checkout your profile repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Generate the 3D contribution graph
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      # Commit the generated SVG
      - name: Commit generated graph
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update 3D contribution graph"
            git push
          fi
