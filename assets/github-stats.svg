<svg
xmlns="http://www.w3.org/2000/svg"
width="1200"
height="430"
viewBox="0 0 1200 430">

<defs>

    <linearGradient
        id="borderGradient"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
            offset="0%"
            stop-color="#00D4FF"/>

        <stop
            offset="50%"
            stop-color="#A855F7"/>

        <stop
            offset="100%"
            stop-color="#FF4F9A"/>

    </linearGradient>

    <linearGradient
        id="titleGradient"
        x1="0"
        y1="0"
        x2="1"
        y2="0">

        <stop
            offset="0%"
            stop-color="#00D4FF"/>

        <stop
            offset="100%"
            stop-color="#FF4F9A"/>

    </linearGradient>

    <filter id="glow">

        <feGaussianBlur
            stdDeviation="4"
            result="blur"/>

        <feMerge>

            <feMergeNode
                in="blur"/>

            <feMergeNode
                in="SourceGraphic"/>

        </feMerge>

    </filter>

</defs>


<!-- Background -->

<rect
    width="100%"
    height="100%"
    fill="#0D1117"/>


